document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

utton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"resultcard\" data-el=\"result\">\n          <div class=\"rhead\">\n            <span class=\"rlang\" data-el=\"rlang\">TIẾNG NHẬT<\u002Fspan>\n            <span style=\"flex:1\"><\u002Fspan>\n            <button class=\"ric\" data-act=\"speak\" title=\"Phát âm\">🔊<\u002Fbutton>\n            <button class=\"ric\" data-act=\"copy\" title=\"Sao chép\">⧉<\u002Fbutton>\n          <\u002Fdiv>\n          <div class=\"rtext\" data-el=\"rtext\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"wordscard\" data-el=\"wordscard\">\n          <div class=\"whead\">CHẠM TỪ ĐỂ LƯU VÀO SỔ TAY<\u002Fdiv>\n          <div class=\"chips\" data-el=\"chips\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div data-el=\"recentswrap\">\n          <div class=\"recents-head\">\n            <span class=\"eyebrow\">GẦN ĐÂY<\u002Fspan>\n            <button class=\"cl\" data-act=\"clear-recents\">Xóa tất cả<\u002Fbutton>\n          <\u002Fdiv>\n          <div data-el=\"recents\"><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- ===== AI (1 màn: trống + chat) ===== -->\n    <div class=\"screen\" data-screen=\"ai\">\n      <div class=\"shead\"><h1>Luyện cùng AI<\u002Fh1><\u002Fdiv>\n      <div class=\"scroll\" data-el=\"chatscroll\">\n        <div class=\"ai-empty\" data-el=\"aiempty\">\n          <div class=\"orb\">✦<\u002Fdiv>\n          <h3>Một người bạn để<br>luyện ngôn ngữ.<\u002Fh3>\n          <p>Hỏi ngữ pháp, thử hội thoại,<br>hoặc nhờ AI sửa câu.<\u002Fp>\n          <button class=\"sug\" data-act=\"sug\" data-q=\"Fix this sentence: I goes to school yesterday\">↗ Sửa câu này giúp mình<\u002Fbutton>\n          <button class=\"sug\" data-act=\"sug\" data-q=\"Luyện hội thoại ngắn với mình nhé\">↗ Luyện hội thoại ngắn<\u002Fbutton>\n        <\u002Fdiv>\n        <div data-el=\"msgs\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"inputbar\">\n        <input placeholder=\"Viết tin nhắn cho AI…\" data-el=\"draft\">\n        <button class=\"send\" data-act=\"send\">↑<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- ===== SỔ TAY ===== -->\n    <div class=\"screen\" data-screen=\"vocab\">\n      <div class=\"shead\">\n        <h1>Sổ tay từ<\u002Fh1>\n        <span class=\"spacer\"><\u002Fspan>\n        <button class=\"btn small\" data-go=\"flashcard\">Luyện Flashcard<\u002Fbutton>\n      <\u002Fdiv>\n      <div class=\"scroll\" data-el=\"vocablist\"><\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- ===== FLASHCARD ===== -->\n    <div class=\"screen\" data-screen=\"flashcard\">\n      <div class=\"shead\">\n        <button class=\"back\" data-go=\"vocab\">‹<\u002Fbutton>\n        <h1>Flashcard<\u002Fh1>\n      <\u002Fdiv>\n      <div class=\"scroll\">\n        <p class=\"fc-count\" data-el=\"fccount\">Ôn tập hôm nay · 1 / 3<\u002Fp>\n        <div class=\"flash\" data-act=\"flip\">\n          <b data-el=\"fcword\">hello<\u002Fb>\n          <span class=\"ipa\" data-el=\"fcipa\">/həˈloʊ/<\u002Fspan>\n          <span class=\"meaning\" data-el=\"fcmean\">xin chào<\u002Fspan>\n          <span class=\"hint\">Chạm vào thẻ để xem nghĩa<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:12px\">\n          <button class=\"btn ghost\" style=\"flex:1;height:48px;font-size:14px\" data-act=\"fcspeak\">🔊 Phát âm<\u002Fbutton>\n          <button class=\"btn\" style=\"flex:1;height:48px;font-size:14px\" data-act=\"fcnext\">Thẻ tiếp theo →<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- ===== CÁ NHÂN ===== -->\n    <div class=\"screen\" data-screen=\"profile\">\n      <div class=\"shead\"><h1>Cá nhân<\u002Fh1><\u002Fdiv>\n      <div class=\"scroll\">\n        <div class=\"banner\">\n          <div class=\"bav\">N<\u002Fdiv>\n          <div><b>Nguyễn Văn A<\u002Fb><p>user1@example.com<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"sect\">Tài khoản<\u002Fdiv>\n        <div class=\"card\">\n          <div class=\"prow\">\n            <div class=\"pic\">🔒<\u002Fdiv>\n            <div><b>Đổi mật khẩu<\u002Fb><p>Cập nhật thông tin bảo mật<\u002Fp><\u002Fdiv>\n            <span class=\"go\">›<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"prow\" data-act=\"logout\">\n            <div class=\"pic\" style=\"background:var(--coral-tint)\">⎋<\u002Fdiv>\n            <div><b style=\"color:var(--cranberry)\">Đăng xuất<\u002Fb><p>Thoát khỏi tài khoản trên thiết bị này<\u002Fp><\u002Fdiv>\n            <span class=\"go\">›<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"card\" style=\"display:flex;gap:12px;align-items:center;padding:15px 16px\">\n          <span style=\"color:var(--coral);font-size:18px\">✦<\u002Fspan>\n          <p style=\"font-size:13.5px;line-height:1.5\">Một góc nhỏ để dịch, luyện tập và giữ lại những từ đáng nhớ.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ===== TAB BAR ===== -->\n  <div class=\"tabbar\" data-el=\"tabbar\"><\u002Fdiv>\n\n  <!-- ===== LOGIN/ĐĂNG KÝ (1 màn, phủ toàn bộ; mặc định đã đăng nhập) ===== -->\n  <div class=\"login\" data-el=\"login\">\n    <div class=\"brand\"><div class=\"logo-tile\">文A<\u002Fdiv><span>lingua<\u002Fspan><\u002Fdiv>\n    <h2 data-el=\"authtitle\">Chào mừng<br>quay trở lại.<\u002Fh2>\n    <p class=\"sub\" data-el=\"authsub\">Tiếp tục hành trình học ngôn ngữ của bạn, từng câu một.<\u002Fp>\n    <div class=\"field only-register\"><span class=\"fic\">👤<\u002Fspan><span class=\"ph\">Họ và tên<\u002Fspan><\u002Fdiv>\n    <div class=\"field\"><span class=\"fic\">@<\u002Fspan><span class=\"ph\">Email<\u002Fspan><\u002Fdiv>\n    <div class=\"field\"><span class=\"fic\">🔒<\u002Fspan><span class=\"ph\">Mật khẩu<\u002Fspan><span style=\"color:var(--green)\">👁<\u002Fspan><\u002Fdiv>\n    <button class=\"btn\" style=\"margin-top:10px\" data-act=\"dologin\" data-el=\"authbtn\">Đăng nhập<\u002Fbutton>\n    <p class=\"switch\"><span data-el=\"authq\">Chưa có tài khoản?<\u002Fspan> <a data-act=\"toggle-auth\" data-el=\"autha\">Đăng ký ngay<\u002Fa><\u002Fp>\n  <\u002Fdiv>\n\n  <!-- ===== SHEET LƯU TỪ ===== -->\n  <div class=\"overlay\" data-el=\"overlay\">\n    <div class=\"sheet\">\n      <h3 data-el=\"sheettitle\">Lưu từ \"morning\"<\u002Fh3>\n      <div class=\"outfield\">\n        <label>Nghĩa của từ *<\u002Flabel>\n        <input data-el=\"sheetmeaning\">\n      <\u002Fdiv>\n      <p class=\"helper\">Đã tự điền gợi ý, bạn có thể sửa lại<\u002Fp>\n      <div class=\"sheet-actions\">\n        <button class=\"huy\" data-act=\"sheet-close\">Hủy<\u002Fbutton>\n        <button class=\"btn\" style=\"height:52px;border-radius:16px\" data-act=\"sheet-save\">Lưu vào sổ tay<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Ftemplate>\n\n<script>\nconst PHRASES = {\n  ja: {\n    'good morning, how are you today?': 'おはようございます、今日はどうですか？',\n    'good morning': 'おはようございます',\n    'hello': 'こんにちは',\n    'thank you': 'ありがとうございます',\n    'where is the nearest airport?': '最寄りの空港はどこですか？',\n    'i have a meeting tomorrow morning.': '明日の朝、会議があります。',\n    'how are you?': 'お元気ですか？'\n  },\n  vi: {\n    'good morning, how are you today?': 'Chào buổi sáng, hôm nay bạn thế nào?',\n    'good morning': 'Chào buổi sáng',\n    'hello': 'Xin chào',\n    'thank you': 'Cảm ơn bạn',\n    'where is the nearest airport?': 'Sân bay gần nhất ở đâu?',\n    'i have a meeting tomorrow morning.': 'Tôi có một cuộc họp vào sáng mai.',\n    'how are you?': 'Bạn khỏe không?'\n  }\n};\nconst DICT = {\n  ja: {good:'良い',morning:'朝',hello:'こんにちは',how:'どう',are:'です',you:'あなた',today:'今日',thank:'感謝',where:'どこ',nearest:'最寄り',airport:'空港',meeting:'会議',tomorrow:'明日',school:'学校',water:'水',beautiful:'美しい',journey:'旅',i:'私',have:'持つ',go:'行く',eat:'食べる',friend:'友達',love:'愛',book:'本',teacher:'先生',study:'勉強',is:'は',the:'',a:''},\n  vi: {good:'tốt',morning:'buổi sáng',hello:'xin chào',how:'thế nào',are:'là',you:'bạn',today:'hôm nay',thank:'cảm ơn',where:'ở đâu',nearest:'gần nhất',airport:'sân bay',meeting:'cuộc họp',tomorrow:'ngày mai',school:'trường học',water:'nước',beautiful:'xinh đẹp',journey:'hành trình',i:'tôi',have:'có',go:'đi',eat:'ăn',friend:'bạn bè',love:'yêu',book:'sách',teacher:'giáo viên',study:'học',is:'là',the:'',a:'một'}\n};\nconst TABS = [\n  { id:'translate', label:'Dịch',\n    ic:'<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M4 5h9M8.5 3v2c0 4-2.5 7-5 8.5M5 9c1.5 2.5 4.5 4.5 8 5\"/><path d=\"m13 21 4.5-10L22 21M14.8 17h5.4\"/><\u002Fsvg>' },\n  { id:'ai', label:'AI',\n    ic:'<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M12 3l1.7 4.6L18 9.2l-4.3 1.6L12 15.4l-1.7-4.6L6 9.2l4.3-1.6zM19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z\"/><\u002Fsvg>' },\n  { id:'vocab', label:'Sổ tay',\n    ic:'<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M6 3h12v18l-6-4-6 4z\"/><\u002Fsvg>' },\n  { id:'profile', label:'Cá nhân',\n    ic:'<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><circle cx=\"12\" cy=\"8\" r=\"4\"/><path d=\"M4 21c1.5-3.5 4.5-5 8-5s6.5 1.5 8 5\"/><\u002Fsvg>' },\n];\nconst TAB_ACTIVE = { translate:'translate', ai:'ai', vocab:'vocab', flashcard:'vocab', profile:'profile' };\n\nfunction esc(s){ return s.replace(/[&<>\"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c])); }\nfunction speak(text, lang){\n  try {\n    const u = new SpeechSynthesisUtterance(text);\n    u.lang = lang === 'ja' ? 'ja-JP' : (lang === 'vi' ? 'vi-VN' : 'en-US');\n    speechSynthesis.cancel(); speechSynthesis.speak(u);\n  } catch(e) {}\n}\nfunction translate(text, lang){\n  const t = text.trim(); if (!t) return '';\n  const p = PHRASES[lang][t.toLowerCase().replace(/\\s+/g,' ')];\n  if (p) return p;\n  const out = t.toLowerCase().replace(/[^a-z'\\s]/g,'').split(/\\s+/)\n    .map(w => DICT[lang][w] === undefined ? w : DICT[lang][w]).filter(Boolean);\n  return lang === 'ja' ? out.join('') : out.join(' ');\n}\nfunction aiReply(q){\n  if (/goes|went|yesterday/i.test(q))\n    return 'Câu đúng là: \"I went to school yesterday.\"\\n\\nHai lỗi nhỏ: goes → went (quá khứ đơn vì có \"yesterday\"), và chủ ngữ \"I\" không chia -es. Thử đặt một câu khác với \"went\" xem sao?';\n  if (/hội thoại|conversation|luyện/i.test(q))\n    return 'Được! Mình bắt đầu nhé — bằng tiếng Anh:\\n\\n\"Hi! What did you do last weekend?\"\\n\\nBạn trả lời thử, mình sẽ sửa giúp nếu có lỗi.';\n  return 'Ý hay đó! Gửi mình câu tiếng Anh cụ thể, mình sẽ sửa ngữ pháp và gợi ý cách nói tự nhiên hơn. (Trả lời mẫu của prototype)';\n}\n\ndocument.querySelectorAll('.app').forEach(app => {\n  app.appendChild(document.getElementById('tpl').content.cloneNode(true));\n  const $ = sel => app.querySelector(sel);\n  const el = name => app.querySelector(`[data-el=\"${name}\"]`);\n\n  const state = {\n    toLang: 'ja', authMode: 'login', fcIndex: 0,\n    saved: [\n      {w:'hello', ipa:'/həˈloʊ/', m:'xin chào', dir:'EN → VI'},\n      {w:'beautiful', ipa:'/ˈbjuː.tɪ.fəl/', m:'xinh đẹp', dir:'EN → VI'},\n      {w:'journey', ipa:'/ˈdʒɜːr.ni/', m:'hành trình', dir:'EN → VI'}\n    ],\n    recents: [\n      {src:'Good morning, how are you today?', dst:'おはようございます、今日はどうですか？', dir:'EN → JA', time:'08:28', lang:'ja'},\n      {src:'Where is the nearest airport?', dst:'Sân bay gần nhất ở đâu?', dir:'EN → VI', time:'Hôm qua', lang:'vi'},\n      {src:'I have a meeting tomorrow morning.', dst:'Tôi có một cuộc họp vào sáng mai.', dir:'EN → VI', time:'27/08', lang:'vi'}\n    ],\n    sheetWord: null\n  };\n\n  // tab bar\n  function renderTabs(screen){\n    el('tabbar').innerHTML = TABS.map(t => `\n      <button class=\"tab ${TAB_ACTIVE[screen] === t.id ? 'on' : ''}\" data-go=\"${t.id}\">\n        <span class=\"ipill\">${t.ic}<\u002Fspan>${t.label}\n      <\u002Fbutton>`).join('');\n  }\n\n  function show(id){\n    if (id !== 'translate' && el('input').value.trim()) pushRecent();\n    app.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.dataset.screen === id));\n    el('overlay').classList.remove('on');\n    renderTabs(id);\n    if (id === 'vocab') renderVocab();\n    if (id === 'flashcard') { state.fcIndex = 0; renderFlash(false); }\n  }\n\n  // ===== dịch =====\n  function renderTranslate(){\n    const text = el('input').value;\n    const result = translate(text, state.toLang);\n    el('result').style.display = result ? 'block' : 'none';\n    el('wordscard').style.display = result ? 'block' : 'none';\n    el('recentswrap').style.display = text.trim() ? 'none' : 'block';\n    $('.clear').style.display = text.trim() ? 'block' : 'none';\n    el('rlang').textContent = state.toLang === 'ja' ? 'TIẾNG NHẬT' : 'TIẾNG VIỆT';\n    el('rtext').textContent = result;\n    el('chips').innerHTML = text.trim() ? text.replace(/[.,!?]/g,'').split(/\\s+/).filter(Boolean).map(w => {\n      const known = !!DICT[state.toLang][w.toLowerCase()];\n      return `<button class=\"chip ${known ? 'known' : ''}\" data-word=\"${esc(w)}\">${esc(w)}<\u002Fbutton>`;\n    }).join('') : '';\n  }\n  function renderRecents(){\n    el('recents').innerHTML = state.recents.map((r, i) => `\n      <div class=\"rcard\" data-recent=\"${i}\">\n        <div class=\"meta\"><span class=\"pill ok\">${r.dir}<\u002Fspan><time>${r.time}<\u002Ftime><\u002Fdiv>\n        <div class=\"src\">${esc(r.src)}<\u002Fdiv>\n        <div class=\"dst\">${esc(r.dst)}<\u002Fdiv>\n      <\u002Fdiv>`).join('');\n  }\n  function pushRecent(){\n    const text = el('input').value.trim();\n    const dst = translate(text, state.toLang);\n    if (!text || !dst) return;\n    if (state.recents.length && state.recents[0].src === text) return;\n    const now = new Date();\n    state.recents.unshift({src:text, dst, dir:'EN → ' + (state.toLang === 'ja' ? 'JA' : 'VI'),\n      time: now.getHours() + ':' + String(now.getMinutes()).padStart(2,'0'), lang: state.toLang});\n    state.recents = state.recents.slice(0, 8);\n    renderRecents();\n  }\n\n  // ===== sổ tay / flashcard =====\n  function renderVocab(){\n    el('vocablist').innerHTML = state.saved.length ? state.saved.map((s, i) => `\n      <div class=\"wcard\">\n        <div class=\"w\">\n          <b>${esc(s.w)}<\u002Fb><span class=\"ipa\">${s.ipa || ''}<\u002Fspan>\n          ${s.fresh ? '<span class=\"pill coral\" style=\"margin-left:6px\">mới lưu<\u002Fspan>' : ''}\n          <div class=\"mean\">${esc(s.m)}<\u002Fdiv>\n          <div class=\"dir\">${s.dir}<\u002Fdiv>\n        <\u002Fdiv>\n        <button class=\"act\" data-vspeak=\"${i}\">🔊<\u002Fbutton>\n        <button class=\"act\" data-vdel=\"${i}\">🗑<\u002Fbutton>\n      <\u002Fdiv>`).join('')\n      : '<p class=\"vocab-empty\">Chưa có từ nào.<br>Dịch một câu rồi chạm vào từ để lưu nhé.<\u002Fp>';\n  }\n  function renderFlash(flipped){\n    const list = state.saved;\n    const fc = list.length ? list[state.fcIndex % list.length] : null;\n    el('fcword').textContent = fc ? fc.w : 'Chưa có từ';\n    el('fcipa').textContent = fc ? fc.ipa : '';\n    el('fcmean').textContent = fc ? fc.m : '';\n    el('fccount').textContent = list.length\n      ? 'Ôn tập hôm nay · ' + ((state.fcIndex % list.length) + 1) + ' / ' + list.length\n      : 'Ôn tập hôm nay · 0 / 0';\n    $('.flash').classList.toggle('flipped', !!flipped);\n  }\n\n  // ===== AI =====\n  function addMsg(html){ el('msgs').insertAdjacentHTML('beforeend', html);\n    el('chatscroll').scrollTop = el('chatscroll').scrollHeight; }\n  function send(text){\n    const t = (text || '').trim(); if (!t) return;\n    el('aiempty').style.display = 'none';\n    addMsg(`<div class=\"bubble-user\"><div class=\"txt\">${esc(t)}<\u002Fdiv><\u002Fdiv>`);\n    el('draft').value = '';\n    setTimeout(() => addMsg(`<div class=\"bubble-ai\">${esc(aiReply(t))}<\u002Fdiv>`), 650);\n  }\n\n  // ===== auth =====\n  function renderAuth(){\n    const reg = state.authMode === 'register';\n    el('login').classList.toggle('register', reg);\n    el('authtitle').innerHTML = reg ? 'Tạo không gian<br>học của riêng bạn.' : 'Chào mừng<br>quay trở lại.';\n    el('authsub').textContent = reg ? 'Lưu lại từ mới, luyện nói và theo dõi tiến bộ mỗi ngày.'\n                                    : 'Tiếp tục hành trình học ngôn ngữ của bạn, từng câu một.';\n    el('authbtn').textContent = reg ? 'Bắt đầu học' : 'Đăng nhập';\n    el('authq').textContent = reg ? 'Đã có tài khoản?' : 'Chưa có tài khoản?';\n    el('autha').textContent = reg ? 'Đăng nhập' : 'Đăng ký ngay';\n  }\n\n  // ===== events =====\n  el('input').addEventListener('input', renderTranslate);\n  el('draft').addEventListener('keydown', e => { if (e.key === 'Enter') send(el('draft').value); });\n\n  app.addEventListener('click', e => {\n    const go = e.target.closest('[data-go]');\n    if (go) { show(go.dataset.go); return; }\n    const act = e.target.closest('[data-act]');\n    if (act) {\n      const a = act.dataset.act;\n      if (a === 'tolang') {\n        state.toLang = state.toLang === 'ja' ? 'vi' : 'ja';\n        act.textContent = (state.toLang === 'ja' ? 'Tiếng Nhật' : 'Tiếng Việt') + ' ▾';\n        renderTranslate();\n      }\n      if (a === 'swap' || a === 'clear') { pushRecent(); el('input').value = ''; renderTranslate(); }\n      if (a === 'speak') speak(el('rtext').textContent, state.toLang);\n      if (a === 'copy') { try { navigator.clipboard.writeText(el('rtext').textContent); } catch(err) {} }\n      if (a === 'voice') {\n        const lbl = act.querySelector('span');\n        lbl.textContent = 'Đang nghe…';\n        setTimeout(() => { lbl.textContent = 'Nói để dịch';\n          el('input').value = 'Where is the nearest airport?'; renderTranslate(); }, 1400);\n      }\n      if (a === 'clear-recents') { state.recents = []; renderRecents(); }\n      if (a === 'sug') send(act.dataset.q);\n      if (a === 'send') send(el('draft').value);\n      if (a === 'flip') $('.flash').classList.toggle('flipped');\n      if (a === 'fcnext') { state.fcIndex++; renderFlash(false); }\n      if (a === 'fcspeak') { const list = state.saved;\n        if (list.length) speak(list[state.fcIndex % list.length].w, 'en'); }\n      if (a === 'logout') { state.authMode = 'login'; renderAuth(); el('login').classList.add('on'); }\n      if (a === 'dologin') { el('login').classList.remove('on'); show('translate'); }\n      if (a === 'toggle-auth') { state.authMode = state.authMode === 'login' ? 'register' : 'login'; renderAuth(); }\n      if (a === 'sheet-close') el('overlay').classList.remove('on');\n      if (a === 'sheet-save') {\n        state.saved.unshift({w: state.sheetWord.toLowerCase(), ipa: '',\n          m: el('sheetmeaning').value || '—',\n          dir: 'EN → ' + (state.toLang === 'ja' ? 'JA' : 'VI'), fresh: true});\n        el('overlay').classList.remove('on');\n      }\n      return;\n    }\n    const chipEl = e.target.closest('[data-word]');\n    if (chipEl) {\n      state.sheetWord = chipEl.dataset.word;\n      el('sheettitle').textContent = `Lưu từ \"${state.sheetWord}\"`;\n      el('sheetmeaning').value = DICT[state.toLang][state.sheetWord.toLowerCase()] || '';\n      el('overlay').classList.add('on');\n      return;\n    }\n    const rec = e.target.closest('[data-recent]');\n    if (rec) {\n      const r = state.recents[+rec.dataset.recent];\n      state.toLang = r.lang;\n      $('.langbar [data-act=\"tolang\"]').textContent = (r.lang === 'ja' ? 'Tiếng Nhật' : 'Tiếng Việt') + ' ▾';\n      el('input').value = r.src; renderTranslate();\n      return;\n    }\n    const vs = e.target.closest('[data-vspeak]');\n    if (vs) { speak(state.saved[+vs.dataset.vspeak].w, 'en'); return; }\n    const vd = e.target.closest('[data-vdel]');\n    if (vd) { state.saved.splice(+vd.dataset.vdel, 1); renderVocab(); return; }\n    if (e.target === el('overlay')) el('overlay').classList.remove('on');\n  });\n\n  renderTabs('translate');\n  renderTranslate();\n  renderRecents();\n});\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
